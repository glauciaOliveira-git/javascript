<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
</head>
<body>
    <script>
       var nome = prompt('Qual é o seu nome?')
       document.write(`Seu nome tem ${nome.length} letras.<br>`)
       document.write(`Olá,<strong> ${nome}</strong> seu nome em maiuscuals é: ${nome.toUpperCase ()}.<br>`)
       document.write(`Olá, seu nome em minuscula é: ${nome.toLowerCase ()}`)

    </script>

    
</body>
</html>
